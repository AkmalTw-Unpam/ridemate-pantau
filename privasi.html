<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pindah alamat · RideMate</title>
<!--
  Pengalih. Alamat ini pindah ke ridemate.my.id, dan halaman ini tinggal
  supaya tautan yang terlanjur tersebar tidak putus:

  - Email reset password dan konfirmasi akun yang sudah terkirim
  - APK RideMate yang sudah beredar, yang PANTAU_URL-nya masih menunjuk ke sini
  - Tautan pantau yang sudah dibagikan ke keluarga seseorang

  Jangan dihapus sampai yakin tidak ada lagi yang memakainya. Biaya
  menyimpannya nol; biaya menghapusnya terlalu cepat adalah orang yang
  tidak bisa masuk lagi ke akunnya.
-->
<meta http-equiv="refresh" content="3;url=https://ridemate.my.id/privasi.html">
<link rel="icon" type="image/png" sizes="64x64" href="https://ridemate.my.id/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; padding: 32px 20px;
    display: flex; align-items: center; justify-content: center;
    background: #14403C; color: #FAF4E8;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6; text-align: center;
  }
  main { max-width: 420px; }
  .merek-logo {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none; color: #FAF4E8;
    font-family: "Poppins", system-ui, sans-serif;
    font-weight: 800; font-size: 19px; letter-spacing: -0.02em;
    margin-bottom: 22px;
  }
  .merek-logo img { width: 34px; height: 34px; object-fit: contain; display: block; }
  h1 { font-family: "Poppins", system-ui, sans-serif; font-size: 22px; margin: 0 0 10px; font-weight: 650; }
  p { font-size: 15px; color: #D9CFBD; margin: 0 0 18px; }
  a.tombol {
    display: inline-block; padding: 12px 24px; border-radius: 999px;
    background: #D97A2B; color: #16232E; text-decoration: none;
    font-weight: 600; font-size: 15px;
  }
  .kecil { font-size: 13px; color: #86A697; margin-top: 20px; }
</style>
</head>
<body>
<main>
  <a class="merek-logo" href="https://ridemate.my.id/">
    <img src="https://ridemate.my.id/logo.png" alt=""><span>RideMate</span>
  </a>
  <h1>Halaman ini pindah alamat</h1>
  <p>Kebijakan privasi sekarang ada di <b>ridemate.my.id</b>. Kamu sedang dialihkan ke sana.</p>
  <a class="tombol" id="lanjut" href="https://ridemate.my.id/privasi.html">Lanjutkan sekarang</a>
  <p class="kecil">Kalau halaman ini tidak berpindah sendiri dalam beberapa detik,
     tekan tombol di atas.</p>
</main>
<script>
(function () {
  // search DAN hash dibawa serta. Supabase menaruh token hasil
  // autentikasi di belakang tanda pagar, dan tautan pantau menaruh
  // tokennya di ?t= — keduanya harus ikut pindah, atau tautannya mati.
  var tujuan = "https://ridemate.my.id/privasi.html" + location.search + location.hash;
  document.getElementById("lanjut").href = tujuan;
  location.replace(tujuan);
})();
</script>
</body>
</html>
